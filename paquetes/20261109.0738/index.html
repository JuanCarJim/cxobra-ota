<!-- maximum-scale=1 (29-oct): el iPhone amplía la página al tocar un campo con
     letra de menos de 16 px (las lecturas de la toma de datos van a 14-15 px) y
     no la devuelve a su tamaño: desde ahí todo salía cortado por la derecha y
     la cabecera se metía bajo la hora. Con esto no amplía al escribir; en
     Safari se sigue pudiendo ampliar con dos dedos. -->

<meta name="robots" content="noindex">
<title>Vidaire Cx</title>
<!-- CX OBRA: la app del móvil de la obra. Barra flotante abajo según el rol
     (Inicio · X · [+] · Y · Más, barraRol.js) y, dentro de cada una, sus
     secciones arriba; la obra se elige una vez en la cabecera y vale
     para todas (carcasa.js). Cada sección es un script que se activa con su
     dirección: #commissioning, #partes, #ncr, #albaranes, #inventario, #bloc,
     #personal, #estanqueidad y #cuenta.
     La sirve la app del ordenador por la wifi (electron/movil/servidor.js), y
     las direcciones son relativas porque todo cuelga de /m/<llave>/. acceso.js
     va el primero: pide el correo y la contraseña y deja solo las secciones
     del rol (el ordenador lo vuelve a comprobar en cada petición).
     Instalable (PWA): Safari › Compartir › Añadir a pantalla de inicio. -->

<script>
/* La paleta Vidaire y su tema (9-nov): antes de pintar, para que no parpadee. Claro u oscuro: ?tema= en la
   dirección, lo guardado, o el del teléfono. */
(function () {
  var r = document.documentElement; r.setAttribute('data-paleta', 'vidaire');
  var t = ''; try { t = (/[?&]tema=(claro|oscuro)/.exec(location.search) || [])[1] || localStorage.getItem('cx-tema') || ''; } catch (e) {}
  if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
  if (t === 'oscuro') { r.setAttribute('data-tema', 'oscuro'); var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', '#141B2D'); }
})();
</script>
<link rel="stylesheet" href="movil.css">

<style>.arranque-ipad,.arranque-cx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F4F6F5;z-index:9999}html[data-tema="oscuro"] .arranque-ipad,html[data-tema="oscuro"] .arranque-cx{background:#161618}.arq-aguja{transform-origin:90px 88px;animation:arqAguja 2.4s ease-in-out infinite}@keyframes arqAguja{0%{transform:rotate(-40deg)}35%{transform:rotate(18deg)}55%{transform:rotate(-8deg)}70%,100%{transform:rotate(0)}}@media (prefers-reduced-motion:reduce){.arq-aguja{animation:none}}.arq-aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));padding:9px 14px;border-radius:10px;background:#fff;color:#435254;border:1px solid #D9E0DE;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word}.arq-aviso.arq-mal{border-color:#E3BDBD;color:#9C2B2B}.arq-reintentar{margin-left:6px;border:1px solid #13957A;color:#0E7C66;background:transparent;border-radius:8px;padding:3px 10px;font:inherit;cursor:pointer}</style>

  <script>
    /* 8-nov (JC): el logo de carga dentro de las pantallas es EL MISMO del arranque
       (shared/arranqueLogo.js: la V gruesa del icono y la brújula, solo la aguja se mueve).
       Se mete en línea en cada p.cargando (ver movil.css, .cx-carga); el SVG y su CSS
       salen de window.ARRANQUE_LOGO (arranqueLogo.js, el primer script), nunca de una copia. */
    (function () {
      function logo() {
        var A = window.ARRANQUE_LOGO;
        if (!A) return '';
        if (!document.getElementById('arqEstilo')) {
          var s = document.createElement('style');
          s.id = 'arqEstilo';
          s.textContent = A.CSS;
          (document.head || document.documentElement).appendChild(s);
        }
        return '<span class="cx-carga" aria-hidden="true">' + A.SVG + '</span>';
      }
      function poner(raiz) {
        var ps = raiz && raiz.querySelectorAll ? raiz.querySelectorAll('p.cargando') : [];
        for (var i = 0; i < ps.length; i++) {
          if (ps[i].querySelector('.cx-carga')) continue;
          var l = logo();
          if (l) ps[i].insertAdjacentHTML('afterbegin', l);
        }
      }
      window.cxLogoCarga = logo;
      new MutationObserver(function (cambios) {
        for (var i = 0; i < cambios.length; i++) for (var j = 0; j < cambios[i].addedNodes.length; j++) {
          var n = cambios[i].addedNodes[j];
          if (n.nodeType !== 1) continue;
          if (n.matches && n.matches('p.cargando')) poner(n.parentNode); else poner(n);
        }
      }).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
