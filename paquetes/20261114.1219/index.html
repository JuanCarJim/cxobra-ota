<!-- CX OBRA: la app del móvil de la obra. Barra flotante abajo según el rol
     (Inicio · X · [+] · Y · Más, barraRol.js) y, dentro de cada una, sus
     secciones arriba; la obra se elige una vez en la cabecera y vale
     para todas (carcasa.js). Cada sección es un script que se activa con su
     dirección: #commissioning, #partes, #ncr, #albaranes, #inventario, #bloc,
     #personal, #estanqueidad y #cuenta.
     La sirve la app del ordenador por la wifi (electron/movil/servidor.js), y
     las direcciones son relativas porque todo cuelga de /m/<llave>/. acceso.js
     va el primero: pide el correo y la contraseña y deja solo las secciones
     del rol (el ordenador lo vuelve a comprobar en cada petición).
     Instalable (PWA): Safari › Compartir › Añadir a pantalla de inicio. -->

<script>
/* La paleta Vidaire y su tema (9-nov): antes de pintar, para que no parpadee. SIEMPRE claro/arena como el escritorio
   (JC, 9-nov): el oscuro solo si se pide a propósito (?tema=oscuro o lo guardado); el tema del teléfono NO cuenta. */
(function () {
  var r = document.documentElement; r.setAttribute('data-paleta', 'vidaire');
  var t = ''; try { t = (/[?&]tema=(claro|oscuro)/.exec(location.search) || [])[1] || localStorage.getItem('cx-tema') || ''; } catch (e) {}
  r.style.colorScheme = 'light';
  if (t === 'oscuro') { r.setAttribute('data-tema', 'oscuro'); r.style.colorScheme = 'dark'; var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', '#141B2D'); }
})();
</script>

rder:1px solid #13957A;color:#0E7C66;background:transparent;border-radius:8px;padding:3px 10px;font:inherit;cursor:pointer}</style>

  <script>
    /* 8-nov (JC): el logo de carga dentro de las pantallas es EL MISMO del arranque
       (shared/arranqueLogo.js: la V gruesa del icono y la brújula orbitando alrededor).
       Se mete en línea en cada p.cargando (ver movil.css, .cx-carga); el logo y su CSS
       salen de window.ARRANQUE_LOGO (arranqueLogo.js, el primer script), nunca de una copia. */
    (function () {
      function logo() {
        var A = window.ARRANQUE_LOGO;
        if (!A) return '';
        if (!document.getElementById('arqEstilo')) {
          var s = document.createElement('style');
          s.id = 'arqEstilo';
          s.textContent = A.CSS;
          (document.head || document.documentElement).appendChild(s);
        }
        return '<span class="cx-carga" aria-hidden="true">' + A.LOGO + '</span>';
      }
      function poner(raiz) {
        var ps = raiz && raiz.querySelectorAll ? raiz.querySelectorAll('p.cargando') : [];
        for (var i = 0; i < ps.length; i++) {
          if (ps[i].querySelector('.cx-carga')) continue;
          var l = logo();
          if (l) ps[i].insertAdjacentHTML('afterbegin', l);
        }
      }
      window.cxLogoCarga = logo;
      new MutationObserver(function (cambios) {
        for (var i = 0; i < cambios.length; i++) for (var j = 0; j < cambios[i].addedNodes.length; j++) {
          var n = cambios[i].addedNodes[j];
          if (n.nodeType !== 1) continue;
          if (n.matches && n.matches('p.cargando')) poner(n.parentNode); else poner(n);
        }
      }).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <script>
    /* 13-nov (JC): «al cargar no sale la V, de una pantalla a otra dentro de la app». Al pulsar algo que lleva a otra
       pantalla (pestañas, fichas, plano, Más…) se pone al momento la V del arranque (la de window.cxLogoCarga), pero
       transparente: solo se ve si la pantalla tarda más de ~150 ms (la animación con retraso la lleva el compositor,
       también mientras el teléfono calcula). Se quita en cuanto la pantalla nueva se ha pintado y está quieta. Si la
       pantalla ya enseña su propia carga (p.cargando, con la V grande), esta no se ve: nunca dos V. */
    (function () {
      var NAVEGA = '#barra-inferior button, #barra-inferior a, #segmentos button, [data-cx], [data-pe-marca], [data-pe-fila], [data-pe-planta], a[href^="#"], .enlace';
      var capa = null, desde = 0, ultimo = 0, cambio = false, vivo = false;
      function quitar() { vivo = false; if (capa && capa.parentNode) capa.parentNode.removeChild(capa); capa = null; }
      function mirar() {
        if (!vivo) return;
        var ahora = performance.now();
        var propia = document.querySelector('#app > p.cargando:only-child');
        if (capa) capa.classList.toggle('oculta', Boolean(propia));
        if ((cambio && !propia && ahora - ultimo >= 100) || (!cambio && ahora - desde > 700) || ahora - desde > 20000) { quitar(); return; }
        requestAnimationFrame(mirar);
      }
      function empezar() {
        desde = ultimo = performance.now(); cambio = false;
        if (!capa) {
          var l = window.cxLogoCarga ? window.cxLogoCarga() : '';
          if (!l) return;
          capa = document.createElement('div');
          capa.className = 'cx-transicion';
          capa.setAttribute('aria-hidden', 'true');
          capa.innerHTML = l;
          document.body.appendChild(capa);
        }
        if (!vivo) { vivo = true; requestAnimationFrame(mirar); }
      }
      window.cxCargaTransicion = { empezar: empezar, quitar: quitar };
      new MutationObserver(function (cambios) {
        if (!vivo) return;
        for (var i = 0; i < cambios.length; i++) { if (!capa || !capa.contains(cambios[i].target)) { cambio = true; ultimo = performance.now(); return; } }
      }).observe(document.getElementById('app'), { childList: true, subtree: true });
      document.addEventListener('click', function (e) { var b = e.target && e.target.closest ? e.target.closest(NAVEGA) : null; if (b && !b.disabled) empezar(); }, true);
      document.addEventListener('change', function (e) { if (e.target && e.target.matches && e.target.matches('select[data-pe-planta-sel], #obra-movil')) empezar(); }, true);
      window.addEventListener('hashchange', empezar);
    })();
  </script>
