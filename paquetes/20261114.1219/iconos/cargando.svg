<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -40 140 160" width="140" height="160">
  <!-- 5-nov (JC): la V de Vidaire quieta y el circulito de Cx que sube por la arista, salta, cae en la V, bota y vuelve. -->
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3c7"/><stop offset="1" stop-color="#3f7f72"/>
    </linearGradient>
  </defs>
  <style>
    .bola { animation: camino 2.6s infinite; }
    .giro { transform-box: fill-box; transform-origin: center; animation: giro 2.6s infinite linear; }
    @keyframes camino {
      0%   { transform: translate(86px, 86px); animation-timing-function: ease-in-out; }
      30%  { transform: translate(110px, 25px); animation-timing-function: ease-out; }
      36%  { transform: translate(93px, -1px); animation-timing-function: ease-out; }
      46%  { transform: translate(72px, -32px); animation-timing-function: ease-in; }
      56%  { transform: translate(60px, 77px); animation-timing-function: ease-out; }
      63%  { transform: translate(60px, 56px); animation-timing-function: ease-in; }
      69%  { transform: translate(60px, 77px); animation-timing-function: ease-out; }
      73%  { transform: translate(60px, 70px); animation-timing-function: ease-in; }
      77%  { transform: translate(60px, 77px); animation-timing-function: ease-out; }
      86%  { transform: translate(94px, -4px); animation-timing-function: ease-in; }
      92%  { transform: translate(110px, 25px); animation-timing-function: ease-in-out; }
      100% { transform: translate(86px, 86px); }
    }
    @keyframes giro {
      0% { transform: rotate(0deg); } 36% { transform: rotate(360deg); } 56% { transform: rotate(720deg); }
      77% { transform: rotate(720deg); } 86% { transform: rotate(900deg); } 100% { transform: rotate(1080deg); }
    }
    @media (prefers-reduced-motion: reduce) { .bola, .giro { animation: none; } .bola { transform: translate(86px, 86px); } }
  </style>
  <path d="M28 18 L60 98 L92 18" fill="none" stroke="url(#v)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="bola"><g class="giro">
    <circle cx="0" cy="0" r="11" fill="#3b5f5a"/>
    <path d="M-5 0.5 L-1.5 4 L5.5 -3.5" fill="none" stroke="#5be3a6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
</svg>
